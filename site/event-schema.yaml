version: "0.1"

# Custom events sent to Plausible (cookieless) from src/scripts/main.js via track().
# Types are generated into event-schema.d.ts by: node tools/gen-event-types.mjs
events:
  quote_started:
    intent: First interaction with the quote form. Top of the quote funnel.
    properties: {}

  quote_step_completed:
    intent: "Deprecated: removed by quote in W2 (CONTRACT §13; use the quote_mailto_opened / quote_copied / quote_webmail_opened outcomes). A quote step passed validation (v2 4-step form)."
    properties:
      step:
        type: number
        required: true
        description: Step number just completed (1 to 4).
        examples: [1, 2, 3, 4]

  quote_submitted:
    intent: "Deprecated: removed by quote in W2 (CONTRACT §13; use quote_mailto_opened). Quote form passed validation and the visitor's email app was opened with the request."
    properties:
      service:
        type: enum
        values: [grounds-maintenance, landscape-installation, irrigation, tree-vegetation, not-sure]
        required: true

  call_clicked:
    intent: "Deprecated: removed by quote in W2 (CONTRACT §13; use call_click). A tel link was tapped."
    properties:
      location:
        type: string
        required: true
        examples: [header, hero, cta_band, footer, contact_page, quote_aside]

  email_clicked:
    intent: "Deprecated: removed by quote in W2 (CONTRACT §13; use email_click). A mailto link was clicked."
    properties:
      location:
        type: string
        required: true
        examples: [footer, contact_page]

  capability_statement_downloaded:
    intent: Commercial or public buyer downloaded the capability statement PDF. B2B intent signal.
    properties: {}

  # ---- CONTRACT v3 §13 names (added at the seed; the v2 names above are removed by quote in W2) ----
  quote_mailto_opened:
    intent: The quote builder opened the visitor's email app with the composed request. Primary conversion.
    properties:
      service:
        type: string
        required: true
        description: Service slug, or multiple, or not-sure.
        examples: [grounds-maintenance, landscape-installation, irrigation, tree-vegetation, multiple, not-sure]
      area:
        type: string
        required: true
        description: Area slug, or other.
        examples: [victoria, saanich, oak-bay, other]

  quote_copied:
    intent: The visitor copied the composed quote request from the ready panel.
    properties: {}

  quote_webmail_opened:
    intent: The visitor opened the composed quote request in a webmail compose window.
    properties:
      provider:
        type: enum
        values: [gmail, outlook]
        required: true

  call_click:
    intent: A tel link was tapped. Secondary conversion; location shows which placement earned it.
    properties:
      location:
        type: string
        required: true
        examples: [header, sticky_bar, hero, cta_band, footer, contact_page, quote_ready, quote_aside]

  sms_click:
    intent: An sms link was tapped. Secondary conversion.
    properties:
      location:
        type: string
        required: true
        examples: [header, sticky_bar, hero, cta_band, footer, contact_page, quote_ready, quote_aside]

  email_click:
    intent: A mailto link was clicked. Secondary contact signal.
    properties:
      location:
        type: string
        required: true
        examples: [header, sticky_bar, hero, cta_band, footer, contact_page, quote_ready, quote_aside]
