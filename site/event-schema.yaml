version: "0.1"

# Custom events sent to Plausible (cookieless) through track() in src/scripts/lib/track.js (CONTRACT §13).
# No event property ever carries personal data: only fixed slugs and placement names.
# Types are generated into event-schema.d.ts by: node tools/gen-event-types.mjs
events:
  quote_started:
    intent: First edit in the quote builder (sent once per page view). Top of the quote funnel.
    properties: {}

  call_clicked:
    intent: "Deprecated: v2 name, still sent by the chrome until ds-chrome renames it (CONTRACT §13; use call_click). Delete once nothing emits it. A tel link was tapped."
    properties:
      location:
        type: string
        required: true
        examples: [header, hero, cta_band, footer, contact_page, quote_aside]

  email_clicked:
    intent: "Deprecated: v2 name, still sent by the chrome until ds-chrome renames it (CONTRACT §13; use email_click). Delete once nothing emits it. A mailto link was clicked."
    properties:
      location:
        type: string
        required: true
        examples: [footer, contact_page]

  capability_statement_downloaded:
    intent: Commercial or public buyer downloaded the capability statement PDF. B2B intent signal.
    properties: {}

  # ---- CONTRACT v3 §13 names ----
  quote_mailto_opened:
    intent: The quote builder opened the visitor's email app with the composed request. Primary conversion.
    properties:
      service:
        type: enum
        values: [grounds-maintenance, landscape-installation, irrigation, tree-vegetation, multiple, not-sure]
        required: true
        description: Service slug, or multiple, or not-sure.
      area:
        type: string
        required: true
        description: Municipality slug (one of the 13 in content/site.json), or other.
        examples: [victoria, saanich, oak-bay, other]

  quote_copied:
    intent: The visitor copied the composed quote request from the ready panel.
    properties: {}

  quote_webmail_opened:
    intent: The visitor opened the composed quote request in a webmail compose window.
    properties:
      provider:
        type: enum
        values: [gmail, outlook]
        required: true

  call_click:
    intent: A tel link was tapped. Secondary conversion; location shows which placement earned it.
    properties:
      location:
        type: string
        required: true
        examples: [header, sticky_bar, hero, cta_band, footer, contact_page, quote_ready, quote_aside]

  sms_click:
    intent: An sms link was tapped. Secondary conversion.
    properties:
      location:
        type: string
        required: true
        examples: [header, sticky_bar, hero, cta_band, footer, contact_page, quote_ready, quote_aside]

  email_click:
    intent: A mailto link was clicked. Secondary contact signal.
    properties:
      location:
        type: string
        required: true
        examples: [header, sticky_bar, hero, cta_band, footer, contact_page, quote_ready, quote_aside]
