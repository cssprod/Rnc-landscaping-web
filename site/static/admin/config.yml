# Decap CMS configuration. Content is stored as JSON in /content (repo root).
# Login uses Netlify Identity + Git Gateway (enable both in the Netlify UI).
backend:
  name: git-gateway
  branch: main
site_url: /
locale: en
media_folder: site/static/uploads
public_folder: /uploads
# Image fields store slot IDs from media/images.json, not file paths, so the
# layout keeps working. Upload new photos here and ask your developer to
# point a slot at them.

collections:
  - name: services
    label: Services
    folder: content/services
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: name
    fields:
      - { label: "Slug (do not change)", name: slug, widget: string }
      - { label: Name, name: name, widget: string }
      - { label: "Menu label", name: navLabel, widget: string }
      - { label: "SEO", name: "seo", widget: object, fields: [ { label: "Title (60 characters max)", name: title, widget: string }, { label: "Description (150 to 160 characters)", name: description, widget: text } ] }
      - { label: Hero, name: hero, widget: object, fields: [ { label: Heading, name: h1, widget: string }, { label: Intro, name: lede, widget: text }, { label: "Image slot ID", name: image, widget: string } ] }
      - { label: "Who it is for", name: audiences, widget: list, fields: [ { label: Title, name: title, widget: string }, { label: Text, name: body, widget: text } ] }
      - { label: "What is included", name: includes, widget: list, fields: [ { label: Title, name: title, widget: string }, { label: Text, name: body, widget: text } ] }
      - { label: "Process steps", name: process, widget: list, fields: [ { label: Title, name: title, widget: string }, { label: Text, name: body, widget: text } ] }
      - { label: Seasonal, name: seasonal, widget: list, fields: [ { label: Season, name: season, widget: string }, { label: Items, name: items, widget: list } ] }
      - { label: FAQs, name: faqs, widget: list, fields: [ { label: Question, name: q, widget: string }, { label: Answer, name: a, widget: text } ] }
      - { label: "Detail image slot IDs", name: detailImages, widget: list }

  - name: projects
    label: "Projects (portfolio)"
    folder: content/projects
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} ({{service}}, {{area}})"
    fields:
      - { label: "Slug (lowercase-with-dashes)", name: slug, widget: string }
      - { label: "Sample (untick only for real RNC projects)", name: sample, widget: boolean, default: true }
      - { label: Title, name: title, widget: string }
      - { label: Service, name: service, widget: select, options: ["grounds-maintenance", "landscape-installation", "irrigation", "tree-vegetation"] }
      - { label: Area, name: area, widget: select, options: ["victoria", "saanich", "oak-bay", "esquimalt", "langford", "colwood", "view-royal", "sooke", "central-saanich", "north-saanich", "sidney", "highlands", "metchosin"] }
      - { label: "Client type", name: clientType, widget: select, options: ["Homeowner", "Strata", "Commercial", "Institutional", "Public sector", "General contractor"] }
      - { label: Summary, name: summary, widget: string }
      - { label: Scope, name: scope, widget: list }
      - { label: Duration, name: duration, widget: string }
      - { label: Story, name: story, widget: list, field: { label: Paragraph, name: p, widget: text } }
      - { label: Result, name: result, widget: string }
      - { label: "Testimonial slug", name: testimonial, widget: string, required: false }
      - { label: Images, name: images, widget: object, fields: [ { label: "Before slot", name: before, widget: string }, { label: "After slot", name: after, widget: string }, { label: "Gallery slots", name: gallery, widget: list } ] }

  - name: testimonials
    label: Testimonials
    folder: content/testimonials
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: slug
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: "Sample (untick only for a real, consented review)", name: sample, widget: boolean, default: true }
      - { label: Quote, name: quote, widget: text }
      - { label: "Attribution (e.g. Strata council member, Langford)", name: attribution, widget: string }
      - { label: Service, name: service, widget: select, options: ["grounds-maintenance", "landscape-installation", "irrigation", "tree-vegetation"] }
      - { label: Area, name: area, widget: select, options: ["victoria", "saanich", "oak-bay", "esquimalt", "langford", "colwood", "view-royal", "sooke", "central-saanich", "north-saanich", "sidney", "highlands", "metchosin"] }

  - name: areas
    label: "Service areas"
    folder: content/areas
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: name
    fields:
      - { label: "Slug (do not change)", name: slug, widget: string }
      - { label: Name, name: name, widget: string }
      - { label: "SEO", name: "seo", widget: object, fields: [ { label: "Title (60 characters max)", name: title, widget: string }, { label: "Description (150 to 160 characters)", name: description, widget: text } ] }
      - { label: Heading, name: h1, widget: string }
      - { label: Intro, name: intro, widget: list, field: { label: Paragraph, name: p, widget: text } }
      - { label: Neighbourhoods, name: neighbourhoods, widget: list }
      - { label: "Property types", name: propertyTypes, widget: list }
      - { label: "Local notes", name: localNotes, widget: list, fields: [ { label: Text, name: text, widget: text }, { label: "Source URL", name: sourceUrl, widget: string }, { label: "Check source before relying on it", name: verify, widget: boolean, default: true } ] }
      - { label: "Service sentences", name: servicesBlurb, widget: object, fields: [ { label: "Grounds maintenance", name: grounds-maintenance, widget: string }, { label: "Landscape installation", name: landscape-installation, widget: string }, { label: Irrigation, name: irrigation, widget: string }, { label: "Tree and vegetation", name: tree-vegetation, widget: string } ] }
      - { label: "Featured project slug", name: featuredProject, widget: string }
      - { label: "Image slot ID", name: image, widget: string }

  - name: resources
    label: "Resources (articles)"
    folder: content/resources
    extension: json
    format: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    fields:
      - { label: Slug, name: slug, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: "SEO", name: "seo", widget: object, fields: [ { label: "Title (60 characters max)", name: title, widget: string }, { label: "Description (150 to 160 characters)", name: description, widget: text } ] }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Summary, name: summary, widget: text }
      - { label: "Image slot ID", name: image, widget: string }
      - label: Body
        name: body
        widget: list
        types:
          - { label: Heading, name: heading, widget: object, fields: [ { label: Heading, name: h2, widget: string } ] }
          - { label: Paragraph, name: paragraph, widget: object, fields: [ { label: Text, name: p, widget: text } ] }
          - { label: "Bullet list", name: bullets, widget: object, fields: [ { label: Items, name: list, widget: list } ] }
      - { label: Sources, name: sources, widget: list, fields: [ { label: Label, name: label, widget: string }, { label: URL, name: url, widget: string } ] }

  - name: pages
    label: Pages
    folder: content/pages
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: h1
    fields:
      - { label: "SEO", name: "seo", widget: object, fields: [ { label: "Title (60 characters max)", name: title, widget: string }, { label: "Description (150 to 160 characters)", name: description, widget: text } ] }
      - { label: Heading, name: h1, widget: string }
      - { label: Intro, name: lede, widget: text, required: false }
      - label: Sections
        name: sections
        widget: list
        required: false
        fields:
          - { label: "ID (lowercase, no spaces)", name: id, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Paragraphs, name: body, widget: list, field: { label: Paragraph, name: p, widget: text } }
          - { label: Items, name: items, widget: list, required: false, fields: [ { label: Title, name: title, widget: string }, { label: Text, name: body, widget: text } ] }
      - { label: "FAQs (FAQ page only)", name: faqs, widget: list, required: false, fields: [ { label: Question, name: q, widget: string }, { label: Answer, name: a, widget: text }, { label: Category, name: category, widget: string } ] }
