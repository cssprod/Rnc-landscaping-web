name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Typecheck (JSDoc)
        run: npx --yes -p typescript -p @types/node tsc -p jsconfig.json
      - name: Design tokens and contrast (light and dark)
        run: node ../brand/build-tokens.mjs --check && node ../brand/check-contrast.mjs
      - name: Build (showcase) and static checks
        run: node tools/check-all.mjs
      - name: Browser tests
        run: |
          npx --yes playwright install --with-deps chromium
          npx --yes -p playwright playwright test
      - name: Launch gate (expected to fail until tokens are filled)
        run: SITE_MODE=launch node build.mjs
        continue-on-error: true
      - name: Lighthouse CI
        run: |
          node build.mjs
          npx --yes @lhci/cli@0.14 autorun --collect.staticDistDir=dist --collect.url=/ --collect.url=/services/irrigation/ --collect.url=/quote/ --assert.preset=lighthouse:no-pwa --assert.assertions.categories:performance=warn --assert.assertions.categories:accessibility=error --assert.assertions.categories:seo=warn --assert.assertions.is-crawlable=off --upload.target=temporary-public-storage
      - name: axe accessibility
        run: |
          node tools/serve.mjs 4321 & sleep 2
          for p in / /services/irrigation/ /quote/ /portfolio/ /areas/oak-bay/ /contact/; do npx --yes @axe-core/cli "http://localhost:4321$p" --exit; done
