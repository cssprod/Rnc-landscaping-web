"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# RNC Landscaping static site. The generator lives in site/; output is site/dist.
# No functions, forms, identity or CMS: the site is fully static.
[build]
  base = "site"
  command = "node build.mjs && node tools/check-all.mjs --no-build"
  publish = "dist"
  environment = { NODE_VERSION = "22" }

# Every context builds the showcase edition (placeholders shown as chips, noindex).
# To go live for real: fill site.config.mjs, then set SITE_MODE = "launch" for the
# production context (here or in the Netlify UI). A launch build fails while any
# [TOKEN], Sample item or fixture remains.
[context.production.environment]
  SITE_MODE = "showcase"

# ---------- Headers ----------
# Showcase builds also write dist/_headers with X-Robots-Tag: noindex.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' https://plausible.io; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://plausible.io; form-action 'self' mailto:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# Content-hashed CSS and JS never change at the same URL.
[[headers]]
  for = "/assets/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
