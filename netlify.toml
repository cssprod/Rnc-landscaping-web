"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# RNC Landscaping static site. Base directory is site/ (set here and in the UI).
[build]
  base = "site"
  command = "node build.mjs"
  publish = "dist"
  environment = { NODE_VERSION = "22" }

# CONTEXT is set by Netlify (production / deploy-preview / branch-deploy).
# Production fails the build while bracket tokens, samples or fixtures remain.
[context.production]
  command = "node build.mjs && node tools/check-all.mjs --no-build"

[context.deploy-preview]
  command = "node build.mjs"

[context.branch-deploy]
  command = "node build.mjs"

# ---------- Headers (global for every context) ----------
# Non-production builds also write dist/_headers with X-Robots-Tag: noindex.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"

# Content-Security-Policy is set per section (not on /*) so that /admin/ can
# receive its own, looser policy without two policies being combined.
# build.mjs checks every generated top-level section is listed here.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://images.pexels.com https://upload.wikimedia.org; connect-src 'self' https://plausible.io; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://images.pexels.com https://upload.wikimedia.org; connect-src 'self' https://plausible.io; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

